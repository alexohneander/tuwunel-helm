apiVersion: v1
kind: Pod
metadata:
  name: tuwunel-debug
  labels:
    app: tuwunel-debug
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: debian:latest
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -c
        - |
          trap : TERM
          while true; do sleep 86400; done
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: matrix-tuwunel-data

# Hinweis: Passe claimName bei Bedarf an den tatsächlichen PVC-Namen an.
# Beispiel bei einem Release-Namen wie "tuwunel-test": tuwunel-test-data
