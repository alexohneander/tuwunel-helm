{{- if .Values.gateway.enabled }}
{{- $fullName := include "tuwunel.fullname" . -}}
{{- $servicePort := .Values.service.port -}}
{{- $gatewayName := default $fullName .Values.gateway.name -}}
{{- $gatewayNamespace := default .Release.Namespace .Values.gateway.namespace -}}
{{- $gatewayPath := default "/" .Values.gateway.path -}}
{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  namespace: {{ $gatewayNamespace }}
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "If gateway.create is set to true, gateway.className is required" .Values.gateway.className | quote }}
  listeners:
    - name: {{ .Values.gateway.listener.name | quote }}
      port: {{ .Values.gateway.listener.port }}
      protocol: {{ .Values.gateway.listener.protocol | quote }}
      {{- with .Values.gateway.listener.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- with .Values.gateway.listener.allowedRoutes }}
      allowedRoutes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $gatewayName | quote }}
      namespace: {{ $gatewayNamespace | quote }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: {{ default "PathPrefix" .Values.gateway.pathType | quote }}
            value: {{ $gatewayPath | quote }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $servicePort }}
{{- end }}